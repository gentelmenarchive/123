<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТехноТочка — магазин оргтехники</title>

<style>
:root {
    --orange: #f15a2a;
    --dark: #20252d;
    --gray: #89919c;
    --line: #e9edf1;
    --bg: #f5f7f9;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--dark);
    font-family: Arial, sans-serif;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
    border: none;
}

.wrap {
    max-width: 1250px;
    margin: auto;
    padding: 0 25px;
}

/* Верхняя панель */

.topline {
    background: var(--dark);
    color: white;
    padding: 10px 0;
    font-size: 13px;
}

.topline .wrap {
    display: flex;
    justify-content: space-between;
}

/* Шапка */

.header {
    background: white;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 10px #0000000b;
}

.headrow {
    min-height: 85px;
    display: flex;
    align-items: center;
    gap: 25px;
}

.logo {
    font-size: 29px;
    font-weight: bold;
    color: var(--dark);
    text-decoration: none;
    white-space: nowrap;
}

.logo span {
    color: var(--orange);
}

.catalog-btn, .primary {
    background: var(--orange);
    color: white;
    padding: 13px 22px;
    border-radius: 8px;
    font-weight: bold;
}

.catalog-btn:hover, .primary:hover {
    background: #d9471c;
}

.search {
    flex: 1;
    display: flex;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: #f5f6f8;
}

.search input {
    flex: 1;
    padding: 14px;
    border: none;
    outline: none;
    background: transparent;
}

.search button {
    padding: 0 20px;
    background: transparent;
    font-size: 20px;
}

.head-actions {
    display: flex;
    gap: 20px;
}

.head-action {
    background: none;
    color: #515965;
    position: relative;
    font-size: 13px;
}

.head-action b {
    font-size: 20px;
}

.count {
    background: var(--orange);
    color: white;
    border-radius: 20px;
    padding: 2px 6px;
    font-size: 11px;
}

.nav {
    border-top: 1px solid var(--line);
}

.nav .wrap {
    display: flex;
    gap: 35px;
    padding-top: 13px;
    padding-bottom: 13px;
}

.nav a {
    color: #515965;
    text-decoration: none;
    font-size: 14px;
}

.nav a:hover {
    color: var(--orange);
}

/* Основная часть */

main {
    padding-top: 30px;
    padding-bottom: 60px;
}

.breadcrumbs {
    color: var(--gray);
    font-size: 13px;
    margin-bottom: 20px;
}

/* Главный баннер */

.hero {
    background: linear-gradient(110deg, #e9edf1, #f1f3f5);
    border-radius: 15px;
    min-height: 280px;
    padding: 45px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.eyebrow {
    color: var(--orange);
    font-weight: bold;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 1px;
}

.hero h1 {
    font-size: 42px;
    max-width: 480px;
    margin: 15px 0;
}

.hero p {
    color: #68717d;
    font-size: 16px;
    margin-bottom: 25px;
}

.hero-art {
    width: 350px;
}

/* Категории */

.section {
    margin-top: 40px;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.section h2 {
    font-size: 25px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.category {
    background: white;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 15px;
    text-align: left;
    transition: .2s;
}

.category:hover {
    border-color: var(--orange);
    transform: translateY(-3px);
}

.cat-icon {
    background: #fff0eb;
    color: var(--orange);
    border-radius: 10px;
    width: 55px;
    height: 55px;
    display: grid;
    place-items: center;
    font-size: 25px;
}

.category strong {
    display: block;
}
